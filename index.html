<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육 안내 포털</title>
<style>
  /* 기존과 디자인 동일 (CSS 생략 없이 그대로 유지) */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); width: 100%; max-width: 500px; box-sizing: border-box; }
  h2 { text-align: center; color: #333; font-size: 1.5rem; margin-top: 0; }
  h3 { color: #475569; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px;}
  input, textarea, button { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
  input:focus, textarea:focus { border-color: #3b82f6; outline: none; }
  button { background-color: #3b82f6; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 15px; }
  button:hover { background-color: #2563eb; }
  button.small-btn { width: auto; padding: 6px 12px; font-size: 0.9rem; margin-top: 0; margin-left: 5px; }
  button.edit-btn { background-color: #10b981; }
  button.edit-btn:hover { background-color: #059669; }
  button.delete-btn { background-color: #ef4444; }
  button.delete-btn:hover { background-color: #dc2828; }
  .tabs { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; }
  .tab { cursor: pointer; color: #64748b; font-weight: bold; padding: 10px; flex: 1; text-align: center; }
  .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
  .hidden { display: none !important; }
  #result { margin-top: 20px; padding: 15px; background: #eff6ff; border-radius: 8px; color: #1e3a8a; line-height: 1.5; }
  .admin-note { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 5px; margin-bottom: 15px;}
  .student-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto;}
  .student-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; }
  .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .student-name { font-weight: bold; color: #1e293b;}
  .student-content { font-size: 0.9rem; color: #64748b; white-space: pre-wrap; word-break: break-all; background: white; padding: 8px; border-radius: 4px; border: 1px dashed #cbd5e1;}
  .action-buttons { display: flex; justify-content: flex-end; margin-top: 8px; }
  .no-data { text-align: center; color: #94a3b8; padding: 20px; font-size: 0.9rem;}
</style>

<!-- 🔥 Firebase 라이브러리 추가 -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

</head>
<body>
  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="showTab('student')">교육생 접속</div>
      <div class="tab" onclick="showTab('admin')">관리자 설정</div>
    </div>

    <div id="student-section">
      <h2>교육생 로그인</h2>
      <input type="text" id="studentName" placeholder="본인의 이름을 입력하세요">
      <button onclick="checkMessage()">내용 확인하기</button>
      <div id="result" class="hidden"></div>
    </div>

    <div id="admin-login-section" class="hidden">
        <h2>관리자 인증</h2>
        <input type="password" id="adminPwd" placeholder="관리자 비밀번호" onkeypress="if(event.key === 'Enter') adminLogin()">
        <button onclick="adminLogin()">인증하기</button>
    </div>

    <div id="admin-dashboard-section" class="hidden">
      <h2>관리자 대시보드</h2>
      <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
          <h3 style="margin-top:0;">신규 등록 / 수정</h3>
          <input type="text" id="targetName" placeholder="교육생 이름">
          <textarea id="targetMessage" rows="3" placeholder="해당 교육생이 볼 내용을 입력하세요"></textarea>
          <button onclick="saveMessage()">서버에 저장하기</button>
      </div>
      <h3>등록된 교육생 목록</h3>
      <ul id="studentList" class="student-list"></ul>
      <button onclick="logoutAdmin()" style="background-color: #94a3b8; margin-top: 20px;">로그아웃</button>
    </div>
  </div>

  <script>
    // 🚨 여기에 Firebase 콘솔에서 복사한 설정값을 덮어쓰세요!
    const firebaseConfig = {
      apiKey: "AIzaSyAyWkuxeEgXbf4iV1ppkGx9fdZedYCcPzA",
  authDomain: "kpc-edu-1c5c6.firebaseapp.com",
  projectId: "kpc-edu-1c5c6",
  storageBucket: "kpc-edu-1c5c6.firebasestorage.app",
  messagingSenderId: "432903648141",
  appId: "1:432903648141:web:9c30befc7831890e8783c4"
    };

    // Firebase 초기화 및 Firestore 연결
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isAdminLoggedIn = false;

    // 탭 전환
    function showTab(tab) {
      document.getElementById('student-section').classList.add('hidden');
      document.getElementById('admin-login-section').classList.add('hidden');
      document.getElementById('admin-dashboard-section').classList.add('hidden');
      document.querySelectorAll('.tab')[0].classList.toggle('active', tab === 'student');
      document.querySelectorAll('.tab')[1].classList.toggle('active', tab === 'admin');
      document.getElementById('result').classList.add('hidden');

      if (tab === 'student') {
          document.getElementById('student-section').classList.remove('hidden');
      } else if (tab === 'admin') {
          if (isAdminLoggedIn) showAdminDashboard();
          else document.getElementById('admin-login-section').classList.remove('hidden');
      }
    }

    // 관리자 로그인 (비밀번호는 예시로 1234 고정 - 실제로는 DB에 별도 컬렉션으로 암호화하여 저장하는 것이 안전합니다)
    function adminLogin() {
        const pwd = document.getElementById('adminPwd').value;
        if(pwd === '1234') {
            isAdminLoggedIn = true;
            showAdminDashboard();
        } else alert('비밀번호가 일치하지 않습니다.');
    }

    function logoutAdmin() {
        isAdminLoggedIn = false;
        showTab('student');
    }

    function showAdminDashboard() {
        document.getElementById('admin-login-section').classList.add('hidden');
        document.getElementById('admin-dashboard-section').classList.remove('hidden');
        renderStudentList();
    }

    // 🔥 1. 서버에 데이터 저장하기
    async function saveMessage() {
      const name = document.getElementById('targetName').value.trim();
      const msg = document.getElementById('targetMessage').value.trim();
      
      if(!name || !msg) return alert('이름과 내용을 모두 입력하세요.');
      
      try {
        // 'students' 라는 컬렉션(폴더) 안에 교육생 이름으로 문서를 만듭니다.
        await db.collection("students").doc(name).set({
            message: msg,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('서버에 성공적으로 저장되었습니다.');
        document.getElementById('targetName').value = '';
        document.getElementById('targetMessage').value = '';
        renderStudentList();
      } catch (error) {
        alert('저장 실패: ' + error.message);
      }
    }

    // 🔥 2. 서버에서 전체 목록 불러오기 (관리자용)
    async function renderStudentList() {
        const listContainer = document.getElementById('studentList');
        listContainer.innerHTML = '<li>데이터 불러오는 중...</li>';
        
        try {
            const snapshot = await db.collection("students").get();
            listContainer.innerHTML = '';
            
            if (snapshot.empty) {
                listContainer.innerHTML = '<li class="no-data">등록된 교육생이 없습니다.</li>';
                return;
            }

            snapshot.forEach((doc) => {
                const name = doc.id;
                const data = doc.data();
                
                const li = document.createElement('li');
                li.className = 'student-item';
                li.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">${name}</span>
                        <div class="action-buttons">
                            <button class="small-btn edit-btn" onclick="editMessage('${name}', \`${data.message.replace(/`/g, '\\`')}\`)">수정</button>
                            <button class="small-btn delete-btn" onclick="deleteMessage('${name}')">삭제</button>
                        </div>
                    </div>
                    <div class="student-content">${data.message}</div>
                `;
                listContainer.appendChild(li);
            });
        } catch (error) {
            listContainer.innerHTML = `<li class="no-data">오류 발생: ${error.message}</li>`;
        }
    }

    function editMessage(name, message) {
        document.getElementById('targetName').value = name;
        document.getElementById('targetMessage').value = message;
        document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
    }

    // 🔥 3. 서버에서 데이터 삭제하기
    async function deleteMessage(name) {
        if (confirm(`${name}님의 데이터를 정말 삭제하시겠습니까?`)) {
            try {
                await db.collection("students").doc(name).delete();
                renderStudentList();
            } catch (error) {
                alert('삭제 실패: ' + error.message);
            }
        }
    }

    // 🔥 4. 서버에서 내 데이터 확인하기 (교육생용)
    async function checkMessage() {
      const name = document.getElementById('studentName').value.trim();
      if(!name) return alert('이름을 입력해주세요.');

      const resultDiv = document.getElementById('result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = '서버에서 확인 중...';

      try {
        const docRef = await db.collection("students").doc(name).get();
        if (docRef.exists) {
            const data = docRef.data();
            resultDiv.innerHTML = `<strong>${name}님, 환영합니다.</strong><br><br>${data.message.replace(/\n/g, '<br>')}`;
        } else {
            resultDiv.innerHTML = '등록된 내용이 없습니다. 관리자에게 문의하거나 이름을 다시 확인해주세요.';
        }
      } catch (error) {
        resultDiv.innerHTML = `오류가 발생했습니다: ${error.message}`;
      }
    }
  </script>
</body>
</html>
