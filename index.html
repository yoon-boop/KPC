<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육 안내 포털</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    background-color: #f8f9fa; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px;
    box-sizing: border-box;
  }
  .container { 
    background: white; 
    padding: 30px; 
    border-radius: 12px; 
    box-shadow: 0 4px 16px rgba(0,0,0,0.05); 
    width: 100%; 
    max-width: 500px;
    box-sizing: border-box;
  }
  h2 { text-align: center; color: #333; font-size: 1.5rem; margin-top: 0; }
  h3 { color: #475569; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 25px; margin-bottom: 15px;}
  input, textarea, button { 
    width: 100%; 
    margin-top: 10px; 
    padding: 12px; 
    border: 1px solid #e2e8f0; 
    border-radius: 8px; 
    box-sizing: border-box; 
    font-size: 1rem;
  }
  input:focus, textarea:focus { border-color: #3b82f6; outline: none; }
  button { 
    background-color: #3b82f6; 
    color: white; 
    border: none; 
    cursor: pointer; 
    font-weight: bold; 
    transition: background 0.2s;
    margin-top: 15px;
  }
  button:hover { background-color: #2563eb; }
  button.small-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 0.9rem;
      margin-top: 0;
      margin-left: 5px;
  }
  button.edit-btn { background-color: #10b981; }
  button.edit-btn:hover { background-color: #059669; }
  button.delete-btn { background-color: #ef4444; }
  button.delete-btn:hover { background-color: #dc2828; }
  button.danger-btn { background-color: #ef4444; }
  button.danger-btn:hover { background-color: #dc2828; }

  .tabs { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; }
  .tab { cursor: pointer; color: #64748b; font-weight: bold; padding: 10px; flex: 1; text-align: center; }
  .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
  .hidden { display: none !important; }
  #result { margin-top: 20px; padding: 15px; background: #eff6ff; border-radius: 8px; color: #1e3a8a; line-height: 1.5; }
  .admin-note { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 5px; margin-bottom: 15px;}
  
  /* 리스트 스타일 */
  .student-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto;}
  .student-item { 
      background: #f8fafc; 
      border: 1px solid #e2e8f0; 
      border-radius: 6px; 
      padding: 12px; 
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
  }
  .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
  }
  .student-name { font-weight: bold; color: #1e293b;}
  .student-content { font-size: 0.9rem; color: #64748b; white-space: pre-wrap; word-break: break-all; background: white; padding: 8px; border-radius: 4px; border: 1px dashed #cbd5e1;}
  .action-buttons { display: flex; justify-content: flex-end; margin-top: 8px; }
  .no-data { text-align: center; color: #94a3b8; padding: 20px; font-size: 0.9rem;}
  
  /* 보안 영역 스타일 */
  .security-section { background: #fef2f2; padding: 15px; border-radius: 8px; margin-top: 30px; border: 1px solid #fecaca; }
  .security-section h3 { color: #b91c1c; border-bottom-color: #fca5a5; margin-top: 0; }
</style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="showTab('student')">교육생 접속</div>
      <div class="tab" onclick="showTab('admin')">관리자 설정</div>
    </div>

    <!-- 교육생 화면 -->
    <div id="student-section">
      <h2>교육생 로그인</h2>
      <input type="text" id="studentName" placeholder="본인의 이름을 입력하세요">
      <button onclick="checkMessage()">내용 확인하기</button>
      <div id="result" class="hidden"></div>
    </div>

    <!-- 관리자 로그인 화면 -->
    <div id="admin-login-section" class="hidden">
        <h2>관리자 인증</h2>
        <input type="password" id="adminPwd" placeholder="관리자 비밀번호를 입력하세요" onkeypress="if(event.key === 'Enter') adminLogin()">
        <div class="admin-note">※ 초기 비밀번호는 1234 입니다. 접속 후 변경해주세요.</div>
        <button onclick="adminLogin()">인증하기</button>
    </div>

    <!-- 관리자 대시보드 화면 -->
    <div id="admin-dashboard-section" class="hidden">
      <h2>관리자 대시보드</h2>
      
      <!-- 신규 등록 폼 -->
      <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
          <h3 style="margin-top:0;">신규 등록 / 수정</h3>
          <input type="text" id="targetName" placeholder="교육생 이름">
          <textarea id="targetMessage" rows="3" placeholder="해당 교육생이 볼 내용을 입력하세요"></textarea>
          <button onclick="saveMessage()">저장하기</button>
      </div>

      <!-- 등록된 목록 -->
      <h3>등록된 교육생 목록</h3>
      <ul id="studentList" class="student-list">
          <!-- 자바스크립트로 리스트가 생성됩니다 -->
      </ul>

      <!-- 비밀번호 변경 영역 -->
      <div class="security-section">
          <h3>보안 설정</h3>
          <input type="password" id="newAdminPwd" placeholder="새로운 관리자 비밀번호">
          <button class="danger-btn" onclick="changeAdminPassword()">비밀번호 변경</button>
      </div>

      <button onclick="logoutAdmin()" style="background-color: #94a3b8; margin-top: 20px;">관리자 로그아웃</button>
    </div>
  </div>

  <script>
    const PREFIX = 'userMsg_';
    const PWD_KEY = 'admin_secret_pwd'; // 비밀번호 저장용 키
    let isAdminLoggedIn = false;

    // 현재 설정된 관리자 비밀번호 가져오기 (없으면 '1234' 반환)
    function getAdminPassword() {
        return localStorage.getItem(PWD_KEY) || '1234';
    }

    // 탭 전환 기능
    function showTab(tab) {
      document.getElementById('student-section').classList.add('hidden');
      document.getElementById('admin-login-section').classList.add('hidden');
      document.getElementById('admin-dashboard-section').classList.add('hidden');
      
      document.querySelectorAll('.tab')[0].classList.toggle('active', tab === 'student');
      document.querySelectorAll('.tab')[1].classList.toggle('active', tab === 'admin');
      
      document.getElementById('result').classList.add('hidden');
      document.getElementById('studentName').value = '';

      if (tab === 'student') {
          document.getElementById('student-section').classList.remove('hidden');
      } else if (tab === 'admin') {
          if (isAdminLoggedIn) {
              showAdminDashboard();
          } else {
              document.getElementById('admin-login-section').classList.remove('hidden');
              document.getElementById('adminPwd').value = '';
          }
      }
    }

    // 관리자 로그인
    function adminLogin() {
        const pwd = document.getElementById('adminPwd').value;
        if(pwd === getAdminPassword()) {
            isAdminLoggedIn = true;
            showAdminDashboard();
        } else {
            alert('비밀번호가 일치하지 않습니다.');
        }
    }

    // 관리자 비밀번호 변경
    function changeAdminPassword() {
        const newPwd = document.getElementById('newAdminPwd').value.trim();
        if(!newPwd) {
            return alert('새로운 비밀번호를 입력해주세요.');
        }
        
        if(confirm('관리자 비밀번호를 변경하시겠습니까?')) {
            localStorage.setItem(PWD_KEY, newPwd);
            alert('비밀번호가 성공적으로 변경되었습니다.\n다음 로그인부터는 새 비밀번호를 사용해주세요.');
            document.getElementById('newAdminPwd').value = '';
        }
    }

    // 관리자 로그아웃
    function logoutAdmin() {
        isAdminLoggedIn = false;
        showTab('student');
    }

    // 관리자 대시보드 표시 및 목록 렌더링
    function showAdminDashboard() {
        document.getElementById('admin-login-section').classList.add('hidden');
        document.getElementById('admin-dashboard-section').classList.remove('hidden');
        renderStudentList();
    }

    // 데이터 저장
    function saveMessage() {
      const nameInput = document.getElementById('targetName');
      const msgInput = document.getElementById('targetMessage');
      const name = nameInput.value.trim();
      const msg = msgInput.value.trim();
      
      if(!name || !msg) return alert('교육생 이름과 내용을 모두 입력하세요.');
      
      localStorage.setItem(PREFIX + name, msg);
      
      nameInput.value = '';
      msgInput.value = '';
      renderStudentList();
    }

    // 목록 렌더링
    function renderStudentList() {
        const listContainer = document.getElementById('studentList');
        listContainer.innerHTML = '';
        
        let hasData = false;

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            
            if (key.startsWith(PREFIX)) {
                hasData = true;
                const name = key.substring(PREFIX.length);
                const message = localStorage.getItem(key);
                
                const li = document.createElement('li');
                li.className = 'student-item';
                li.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">${name}</span>
                        <div class="action-buttons">
                            <button class="small-btn edit-btn" onclick="editMessage('${name}')">수정</button>
                            <button class="small-btn delete-btn" onclick="deleteMessage('${name}')">삭제</button>
                        </div>
                    </div>
                    <div class="student-content">${message}</div>
                `;
                listContainer.appendChild(li);
            }
        }

        if (!hasData) {
            listContainer.innerHTML = '<li class="no-data">등록된 교육생이 없습니다.</li>';
        }
    }

    // 데이터 수정
    function editMessage(name) {
        const message = localStorage.getItem(PREFIX + name);
        if (message) {
            document.getElementById('targetName').value = name;
            document.getElementById('targetMessage').value = message;
            document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // 데이터 삭제
    function deleteMessage(name) {
        if (confirm(`${name}님의 데이터를 정말 삭제하시겠습니까?`)) {
            localStorage.removeItem(PREFIX + name);
            renderStudentList();
        }
    }

    // 교육생 내용 확인
    function checkMessage() {
      const name = document.getElementById('studentName').value.trim();
      if(!name) return alert('이름을 입력해주세요.');

      const msg = localStorage.getItem(PREFIX + name);
      const resultDiv = document.getElementById('result');
      
      resultDiv.classList.remove('hidden');
      if(msg) {
        resultDiv.innerHTML = `<strong>${name}님, 환영합니다.</strong><br><br>${msg.replace(/\n/g, '<br>')}`;
      } else {
        resultDiv.innerHTML = '등록된 내용이 없습니다. 관리자에게 문의하거나 이름을 다시 확인해주세요.';
      }
    }
  </script>
</body>
</html>
